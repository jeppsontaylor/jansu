name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release steps without publishing artifacts'
        required: false
        default: 'true'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    needs: [test, security]
    env:
      CLICOLOR: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@v3

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy,rustfmt
          cache: false

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      # ---------- Build ----------
      - name: Build release binary
        run: just release

      - name: Build Docker image
        run: just docker-build

      # ---------- Test ----------
      - name: Run test suite
        run: just test

      # ---------- Security ----------
      - name: Run security lane
        run: ./tools/security-lane.sh

      # ---------- Publish (only on tag, not dry‑run) ----------
      - name: Publish Docker image (if not dry‑run)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != 'true' }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/jansu-io/jansu

      - name: Create GitHub release (if not dry‑run)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/jansu
